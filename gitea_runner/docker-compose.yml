services:
  gitea_runner:
    build: .
    image: ${RUNNER_IMAGE:-gitea-runner:local}
    container_name: ${CONTAINER_NAME:-gitea_runner}
    restart: unless-stopped
    environment:
      - GITEA_INSTANCE_URL=${GITEA_INSTANCE_URL:-http://gitea:3000}
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN:-}
      - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME:-homelab-runner}
      - GITEA_RUNNER_LABELS=${GITEA_RUNNER_LABELS:-ubuntu-latest:host,nix:host}
    volumes:
      - ~/var/lib/homelab/gitea_runner:/data
      - nix-store:/nix
    networks:
      - proxy-net

volumes:
  nix-store: {}

networks:
  proxy-net:
    name: ${PROXY_NETWORK:-proxy-net}
    external: true
